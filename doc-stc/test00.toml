
# ==========================================
#  스타쉽 프롬프트 - 가장 대중적이고 깔끔한 설정
#  FiraCode Nerd Font 최적화 세팅
# ==========================================

# 엔터를 칠 때마다 한 줄씩 띄워주어 가독성을 높입니다 (취향에 따라 false로 변경 가능)
add_newline = true

# =========================================

# 프롬프트 전체 레이아웃 구조 (표시할 모듈들의 순서 정의)
#
# format = """ ... """
# 프롬프트에 띄울 정보들의 순서를 배치한 지도입니다. 
# 맨 마지막에 $line_break가 들어가고 그 밑에 $character(입력기호)가 있어, 첫째 줄에는 파일 경로와 Git 상태, 개발 언어 버전이 한눈에 들어오고, 둘째 줄에는 순수하게 명령어만 길게 입력할 수 있는 구조가 된다.

format = """
[⏱ $time]($style) \
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$line_break\
$character
"""

# =========================================

# [시간 및 날짜 설정] - 요청하신 날짜와 현재 시간 표시
[time]
disabled = false
# format = '[%Y-%m-%d %H:%M:%S]' # 연-월-일 시:분:초 형식 ==> Error !!!
format = '\[%Y-%m-%d %H:%M:%S\]' # 연-월-일 시:분:초 형식 
# format = '([%Y-%m-%d %H:%M:%S])' # 연-월-일 시:분:초 형식
style = "bold yellow"          # 노란색 강조

# =========================================

# [디렉터리 경로]
[directory]
style = "bold cyan"
truncation_length = 3         # 경로가 너무 길면 최대 3개까지만 보여주고 축약
truncate_to_repo = true       # Git 폴더 안에 들어오면 폴드 루트 기준으로 경로 축약
read_only = " 󰌾"              # 읽기 전용 폴더일 때 표시할 아이콘

# =========================================
# [명령어 입력기호 설정 - 2번째 줄 맨 앞에 표시]
[character]
success_symbol = "[❯](bold green) "  # 이전 명령어가 성공했을 때 초록색 화살표
error_symbol = "[❯](bold red) "      # 에러가 발생했을 때 빨간색 화살표

# =========================================
# [Git 브랜치]
[git_branch]
symbol = " "
# symbol = "🌿 "
style = "bold purple"
format = "on [$symbol$branch]($style) "

# =========================================
# [Git 상태 정보 설정 - 실시간 변경 상태 감지]
#
# 코드를 수정하면 📝, 새 파일을 만들면 󰦖, git add를 하면 🟢 아이콘이 경로 옆에 실시간으로 달라붙습니다. 깃허브 원격 저장소에 올릴 커밋이 밀려 있다면 위아래 화살표(⇡, ⇣)로 몇 개의 커밋이 차이 나는지까지 알려줍니다.
[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "󰦖 "
stashed = "📦 "
modified = "📝 "
staged = "🟢 "
renamed = "🚚 "
deleted = "🗑 "

# =========================================
# [주요 개발 언어 버전 표시용 아이콘(너드 폰트 기호) 세팅]
[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol$version]($style) "

# =========================================
[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol$version]($style) "

# =========================================
[rust]
symbol = " "
style = "bold orange"
format = "via [$symbol$version]($style) "

# =========================================
[golang]
symbol = " "
style = "bold blue"
format = "via [$symbol$version]($style) "


# =========================================


